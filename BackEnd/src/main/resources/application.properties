spring.application.name=lumiedu


# ===== PRIMARY DATASOURCE (MySQL Production Configuration) =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== H2 IN-MEMORY (chỉ dùng cho profile 'test') =====
# Để bật H2 console tạm thời debug: thêm spring.h2.console.enabled=true vào application-local.properties


spring.jpa.hibernate.ddl-auto=update
# MySQL tự tạo bảng khi chạy lần đầu. Không cần chạy SQL migration thủ công.
server.port=${PORT:8080}

# ===== HIGH PERFORMANCE SPEED OPTIMIZATIONS =====
# 1. Enable GZIP compression to compress JSON API responses by up to 85%
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# 2. HikariCP Database Connection Pool Optimization (Keep-Alive connections to Aiven Cloud)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=45000

# 3. Disable SQL logging in Production to remove console I/O overhead
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Frontend URL (for email links)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_mock_holder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_mock_holder}
stripe.success-url=http://localhost:5173/dashboard/upgrade?status=success&invoice={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:5173/dashboard/upgrade?status=cancel
stripe.bypass-checkout=false

# Google OAuth2 Credentials
google.client-id=${GOOGLE_CLIENT_ID:299923810846-kfk4pv295irthtmvfdpuj91gijqkilmh.apps.googleusercontent.com}
google.client-secret=${GOOGLE_CLIENT_SECRET:system-default}

# Increase upload and request limits for base64 image data and file uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

# Document Module - File upload directory (relative to working directory)
app.upload.dir=uploads

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY:mock-key}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:mock-gemini-key}

# Spring Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:lumieduteam@gmail.com}
# Mật khẩu ứng dụng (App Password) 16 ký tự của Google
spring.mail.password=${MAIL_PASSWORD:jjbsnszhdiwngdon}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Application Admin Email Destination
app.admin.email=${ADMIN_EMAIL:lumieduteam@gmail.com}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-local-secret-change-me-before-production}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# Google Drive Configuration
google.drive.credentials-path=${GOOGLE_DRIVE_CREDENTIALS_PATH:classpath:google-credentials.json}
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:root}
google.drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
google.drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
google.drive.refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN:}

# Per-user Google Drive OAuth & Encryption settings
google.drive.oauth.redirect-uri=${GOOGLE_DRIVE_OAUTH_REDIRECT_URI:http://localhost:8080/api/integrations/google-drive/callback}
app.encryption.secret=${APP_ENCRYPTION_SECRET:}
